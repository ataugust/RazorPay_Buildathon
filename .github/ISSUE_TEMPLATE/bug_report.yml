name: Bug report
description: Report a reproducible ASC problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve ASC. Never include credentials or payment data.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Buyer Workspace
        - Merchant Console
        - Control Plane
        - Backend API
        - Database or migrations
        - Payment demo
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Enter…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, Node version and Python version.
